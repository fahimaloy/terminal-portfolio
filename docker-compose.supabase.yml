# Self-hosted Supabase stack (external PostgreSQL required)
#
# Prerequisites:
#   - PostgreSQL running on the host with schema applied (run ./setup-db.sh)
#   - Credentials configured in .env
#
# Usage: docker-compose -f docker-compose.supabase.yml up -d

services:
  # ─── API Gateway (Kong) ─────────────────────────────────────
  supabase-kong:
    image: kong:3.8.0
    container_name: portfolio-supabase-kong
    restart: unless-stopped
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
      - "${KONG_HTTPS_PORT:-8443}:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DNS_ORDER: LAST, A, AAAA, CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_DAEMON: "off"
    volumes:
      - ./docker/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      supabase-rest:
        condition: service_started
      supabase-auth:
        condition: service_started
      supabase-storage:
        condition: service_started
      supabase-realtime:
        condition: service_started

  # ─── PostgREST (RESTful PostgreSQL API) ─────────────────────
  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    container_name: portfolio-supabase-rest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-fahimaloy}:${POSTGRES_PASSWORD:-dibona}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-portfolio}
      PGRST_DB_SCHEMA: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PUBLIC_REST_URL:-http://localhost:${KONG_HTTP_PORT:-3838}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── GoTrue (Authentication) ────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.167.0
    container_name: portfolio-supabase-auth
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:${FRONTEND_PORT:-3355}}
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: ${PUBLIC_AUTH_URL:-http://localhost:${KONG_HTTP_PORT:-3838}/auth/v1}
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-fahimaloy}:${POSTGRES_PASSWORD:-dibona}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-portfolio}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 86400
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailhog}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@localhost}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Storage API (File uploads) ─────────────────────────────
  supabase-storage:
    image: supabase/storage-api:v1.11.13
    container_name: portfolio-supabase-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY:-eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTYwMzk5ODA5MiwiZXhwIjoyNzUyMTQ0NDkyLCJyb2xlIjoiYW5vbiJ9.3VZgKmfOqXHE7wJpJLNl5K2XxGeDnR_U5GhHjlGneVk}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTYwMzk5ODA5MiwiZXhwIjoyNzUyMTQ0NDkyLCJyb2xlIjoic2VydmljZV9yb2xlIn0.ZBm1V6gW6pLPYHKJhSFMfcsGg_XM5m3HzBJSKpVqG8A}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: default
      REGION: auto
      GLOBAL_S3_BUCKET: portfolio-media
    volumes:
      - portfolio-storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Realtime (WebSocket) ───────────────────────────────────
  supabase-realtime:
    image: supabase/realtime:v2.33.51
    container_name: portfolio-supabase-realtime
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-portfolio}
      DB_USER: ${POSTGRES_USER:-fahimaloy}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dibona}
      DB_SSL: "false"
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      REPLICATION_MODE: "stream"
      REPLICATION_SLOT: "realtime_replication_slot"
      REPLICATION_PLUGIN: "pgoutput"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── MailHog (Dev email catcher) ────────────────────────────
  supabase-mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: portfolio-supabase-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"

  # ─── PostgreSQL Meta ────────────────────────────────────────
  supabase-meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: portfolio-supabase-meta
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: host.docker.internal
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-portfolio}
      PG_META_DB_USER: ${POSTGRES_USER:-fahimaloy}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-dibona}

volumes:
  portfolio-storage-data:
